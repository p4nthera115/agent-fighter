<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Agent Fighter</title>
    <meta
      name="description"
      content="A browser-based 2D arcade fighter on hand-assembled pixel art. Insert nothing, press any key."
    />
    <meta name="theme-color" content="#454b88" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agent Fighter" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./app-icon-192.png" />
    <meta property="og:title" content="Agent Fighter" />
    <meta property="og:description" content="A browser-based 2D arcade fighter. Press any key." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="assets/clawd/favicon.svg" type="image/svg+xml" />
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="d71fb29b-b296-4fcb-9793-9248a8296858"
    ></script>
  </head>
  <body>
    <div class="cab">
      <div class="cab__body">
        <button class="handheld__mute" id="mute" role="switch" aria-checked="true" aria-label="Sound" title="Turn sound off">
          <span class="mute__track" aria-hidden="true"><span class="mute__knob"></span></span>
          <span class="mute__print" aria-hidden="true">SOUND <b id="mute-label">ON</b></span>
        </button>
        <div class="handheld__brand" aria-hidden="true">Agent</div>
        <div class="handheld__power" aria-hidden="true"><i></i> POWER</div>
        <div class="cab__marquee">
          <span class="cab__speaker" aria-hidden="true"></span>
          <span class="marquee__glass">
            <span class="marquee__lamp" aria-hidden="true"></span>
            <span class="marquee__title">AGENT FIGHTER</span>
            <span class="marquee__sub">1 or 2 players</span>
          </span>
          <span class="cab__speaker" aria-hidden="true"></span>
        </div>

        <div class="cab__area" id="cab-area">
          <div class="cab__frame" id="cab-frame">
            <div class="cab__screen" id="cab-screen">
              <div class="stage-mount" id="stage-mount" role="application" aria-label="Agent Fighter"></div>
              <div class="crt crt--scan" aria-hidden="true"></div>
              <div class="crt crt--grille" aria-hidden="true"></div>
              <div class="crt crt--glare" aria-hidden="true"></div>
              <div class="crt crt--vignette" aria-hidden="true"></div>
              <div class="crt crt--flicker" aria-hidden="true"></div>
            </div>
          </div>
          <span class="handheld__wordmark" aria-hidden="true">GAME BOY <b>ADVANCE</b></span>
        </div>

        <div class="cab__deck">
          <div class="deck__move">
            <div class="stick" id="stick" aria-hidden="true">
              <span class="stick__cover"></span>
              <span class="stick__shaft"></span>
              <span class="stick__ball"></span>
            </div>

            <div class="deck__pad" id="touchpad">
              <button class="pad__btn pad__btn--up" data-touch="up" aria-label="Up">&#9650;</button>
              <button class="pad__btn pad__btn--left" data-touch="left" aria-label="Left">&#9664;</button>
              <button class="pad__btn pad__btn--right" data-touch="right" aria-label="Right">&#9654;</button>
              <button class="pad__btn pad__btn--down" data-touch="down" aria-label="Down">&#9660;</button>
            </div>
          </div>

          <div class="deck__plate">
            <span class="plate__name">AGENT FIGHTER</span>
            <span class="plate__sub">Insert nothing &middot; Free play</span>
            <span class="plate__coin" aria-hidden="true"></span>
          </div>

          <div class="deck__right">
            <div class="deck__buttons">
              <button class="pad__btn pad__btn--atk pad__btn--p" data-touch="punch" aria-label="B — Jab"><span class="desktop-key">P</span><span class="handheld-key">B</span></button>
              <button class="pad__btn pad__btn--atk pad__btn--k" data-touch="kick" aria-label="A — Roundhouse"><span class="desktop-key">K</span><span class="handheld-key">A</span></button>
              <button class="pad__btn pad__btn--atk pad__btn--u" data-touch="uppercut" aria-label="X — Rising Claw"><span class="desktop-key">U</span><span class="handheld-key">X <small>RISE</small></span></button>
              <button class="pad__btn pad__btn--atk pad__btn--super" data-touch="ultimate" aria-label="Y — Ultimate attack (full meter)" title="Ultimate: Y / Space — needs a full meter"><span class="desktop-key">ULT</span><span class="handheld-key">Y <small>ULT</small></span></button>
            </div>

            <button class="handheld__start" id="handheld-start" aria-label="Start or pause game"><span class="start__label">START</span></button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
