<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mascot Fighter</title>
    <meta
      name="description"
      content="A browser-based 2D arcade fighter on hand-assembled pixel art. Insert nothing, press any key."
    />
    <meta name="theme-color" content="#0b0a14" />
    <meta property="og:title" content="Mascot Fighter" />
    <meta property="og:description" content="A browser-based 2D arcade fighter. Press any key." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="assets/clawd/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="cab">
      <div class="cab__body">
        <div class="cab__marquee">
          <span class="cab__speaker" aria-hidden="true"></span>
          <span class="marquee__glass">
            <span class="marquee__lamp" aria-hidden="true"></span>
            <span class="marquee__title">MASCOT FIGHTER</span>
            <span class="marquee__sub">1 or 2 players</span>
          </span>
          <span class="cab__speaker" aria-hidden="true"></span>
        </div>

        <div class="cab__area" id="cab-area">
          <div class="cab__frame" id="cab-frame">
            <div class="cab__screen" id="cab-screen">
              <div class="stage-mount" id="stage-mount" role="application" aria-label="Mascot Fighter"></div>
              <div class="crt crt--scan" aria-hidden="true"></div>
              <div class="crt crt--grille" aria-hidden="true"></div>
              <div class="crt crt--glare" aria-hidden="true"></div>
              <div class="crt crt--vignette" aria-hidden="true"></div>
              <div class="crt crt--flicker" aria-hidden="true"></div>
            </div>
          </div>
        </div>

        <div class="cab__deck">
          <div class="deck__move">
            <div class="stick" id="stick" aria-hidden="true">
              <span class="stick__cover"></span>
              <span class="stick__shaft"></span>
              <span class="stick__ball"></span>
            </div>

            <div class="deck__pad" id="touchpad">
              <button class="pad__btn pad__btn--up" data-touch="up" aria-label="Up">&#9650;</button>
              <button class="pad__btn pad__btn--left" data-touch="left" aria-label="Left">&#9664;</button>
              <button class="pad__btn pad__btn--right" data-touch="right" aria-label="Right">&#9654;</button>
              <button class="pad__btn pad__btn--down" data-touch="down" aria-label="Down">&#9660;</button>
            </div>
          </div>

          <div class="deck__plate">
            <span class="plate__name">MASCOT FIGHTER</span>
            <span class="plate__sub">Insert nothing &middot; Free play</span>
            <span class="plate__coin" aria-hidden="true"></span>
          </div>

          <div class="deck__right">
            <div class="deck__buttons">
              <button class="pad__btn pad__btn--atk pad__btn--p" data-touch="punch" aria-label="Jab">P</button>
              <button class="pad__btn pad__btn--atk pad__btn--k" data-touch="kick" aria-label="Roundhouse">K</button>
              <button class="pad__btn pad__btn--atk pad__btn--u" data-touch="uppercut" aria-label="Rising Claw">U</button>
              <button class="pad__btn pad__btn--atk pad__btn--super" data-touch="ultimate" aria-label="Ultimate attack (spacebar, full meter)" title="Ultimate: Space / full meter">ULT</button>
            </div>

            <div class="deck__start">
              <span class="start__print" aria-hidden="true">Full screen</span>
              <button class="deck__full" id="fullscreen" aria-label="Toggle fullscreen" title="Fullscreen">
                <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                  <path d="M1 1h5v2H3v3H1V1zm9 0h5v5h-2V3h-3V1zM1 10h2v3h3v2H1v-5zm12 0h2v5h-5v-2h3v-3z" fill="currentColor"/>
                </svg>
                <span class="full__label">Full screen</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
